name: FitTrack 0.14.4 verification
on: [push, pull_request]
jobs:
  tests-and-unsigned-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts
      - run: node --check app.js
      - run: node --check cloud.js
      - run: npm run test:runtime
      - run: npm run test:database
      - run: node tests/workout-0140.cjs
      - run: npm audit --audit-level=high
      - run: python3 scripts/package_source.py --output out/FitTrack-Beta-0.14.4-Source.zip
      - run: python3 scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: FitTrack-0.14.4-verification
          path: |
            out/*unsigned.apk
            test-results/
